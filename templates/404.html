{% extends "base.html" %}
{% block title %}Không tìm thấy · EcomCheck{% endblock %}
{% block body_class %}page-404{% endblock %}

{% block content %}
<section class="not-found container">
  <span class="big-404 reveal" aria-hidden="true">404</span>
  <h1 class="reveal" style="--i: 1">Không tìm thấy trang này</h1>
  <p class="lead reveal" style="--i: 2">Có thể lần tìm kiếm này chưa từng được lưu, hoặc file của nó đã bị xóa.</p>
  <a class="btn btn-primary magnetic reveal" style="--i: 3" href="{{ url_for('index') }}"><span>← Về trang tìm kiếm</span></a>
</section>
{% endblock %}
